# =============================================================================
# 基本設定
# =============================================================================

# 256色サポート
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# マウスサポート
set -g mouse on

# ハイパーリンク（OSC 8）サポート
set -as terminal-features ",xterm-ghostty:hyperlinks:clipboard"
set -as terminal-features ",tmux-256color:clipboard"
set -ag terminal-overrides ",xterm-ghostty:Hls"
set -g allow-passthrough on
set -s set-clipboard on

# セッション破棄時に他のセッションへ自動切替（Ghosttyの終了を防止）
set -g detach-on-destroy off

# ウィンドウ/ペイン番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ番号の自動振り直し
set -g renumber-windows on

# アプリケーションによるウィンドウ名の上書きを無効化
set -g allow-rename off
setw -g automatic-rename on

# ヒストリサイズ
set -g history-limit 50000

# エスケープキーの遅延を無くす（vim用）
set -sg escape-time 0

# CSI u 形式の拡張キーを有効化（Ctrl+Tab等のモディファイア付きキーを認識させる）
set -s extended-keys on


# フォーカスイベント（vim用）
set -g focus-events on

# =============================================================================
# キーバインド
# =============================================================================

# prefixキーを Ctrl+Space に変更
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ペイン移動（vim風: h=左, j=下, k=上, l=右）
bind h run-shell 'tmux-sidebar select-pane L'
bind j select-pane -D
bind k select-pane -U
bind l run-shell 'tmux-sidebar select-pane R'


# ペインリサイズを vim 風に
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペイン分割（現在のディレクトリで開く）
bind % split-window -h -c "#{pane_current_path}"
bind n split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# ペイン削除
bind x kill-pane

# 新しいウィンドウは現在のディレクトリで開く
bind c new-window -c "#{pane_current_path}"

# ウィンドウ一覧を現在のセッションに限定（他セッションのウィンドウは非表示）
bind w choose-tree -wf '#{session_attached}'

# fzf でセッション切り替え + 削除（既存sessionのみ表示、enter=switch, X=delete）
bind s display-popup -E "fish -c 'tm --sessions-only'"

# fzf でworktree選択 → 新規session作成（session済みworktree除外）
bind S display-popup -E "fish -c tmw_pick"

# 直前のセッションに戻る
bind m switch-client -l

# Ctrl+Tab → next-window（extended-keys で直接バインド）
bind-key -n C-Tab next-window
bind-key -n C-BTab previous-window

# Cmd+Up/Down でペインスクロール（Ghostty経由のユーザー定義キー）
set -s user-keys[0] "\e[1;9A"
set -s user-keys[1] "\e[1;9B"
bind-key -n User0 copy-mode -e \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User0 send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User1 send-keys -X -N 3 scroll-down

# Cmd+J/K でペインスクロール（Ghostty経由のユーザー定義キー）
set -s user-keys[2] "\e[107;9~"
set -s user-keys[3] "\e[106;9~"
bind-key -n User2 copy-mode -e \; send-keys -X halfpage-up
bind-key -n User3 copy-mode -e \; send-keys -X halfpage-down
bind-key -T copy-mode-vi User2 send-keys -X halfpage-up
bind-key -T copy-mode-vi User3 send-keys -X halfpage-down

# Cmd+1~9 でウィンドウ切替（Ghostty user-keys経由）
set -s user-keys[4] "\e[49;9~"
set -s user-keys[5] "\e[50;9~"
set -s user-keys[6] "\e[51;9~"
set -s user-keys[7] "\e[52;9~"
set -s user-keys[8] "\e[53;9~"
set -s user-keys[9] "\e[54;9~"
set -s user-keys[10] "\e[55;9~"
set -s user-keys[11] "\e[56;9~"
set -s user-keys[12] "\e[57;9~"
bind-key -n User4 select-window -t :1
bind-key -n User5 select-window -t :2
bind-key -n User6 select-window -t :3
bind-key -n User7 select-window -t :4
bind-key -n User8 select-window -t :5
bind-key -n User9 select-window -t :6
bind-key -n User10 select-window -t :7
bind-key -n User11 select-window -t :8
bind-key -n User12 select-window -t :9

# F12: SSH pane でのみパススルーモードを ON にする（非 SSH pane では無視）
unbind -T root F12
bind -T root F12 \
  if-shell 'pgrep -P #{pane_pid} ssh' \
    'set prefix None ; set key-table off ; set status off ; refresh-client -S' \
    ''

# F12: パススルーモード中に LOCAL に復帰する（off テーブルのみ）
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status \;\
  set -u status-style \;\
  set -u status-left \;\
  refresh-client -S

# パススルーモード中にリモート tmux へ CSI u シーケンスを転送
# （SSH は CSI u を要求しないため、tmux が C-Tab を従来形式の Tab に
#   劣化させてしまう問題を回避する）
bind -T off C-Tab send-keys -H 1b 5b 39 3b 35 75
bind -T off C-BTab send-keys -H 1b 5b 39 3b 36 75
# Cmd+K (\e[107;9~) / Cmd+J (\e[106;9~) を転送
bind -T off User2 send-keys -H 1b 5b 31 30 37 3b 39 7e
bind -T off User3 send-keys -H 1b 5b 31 30 36 3b 39 7e
# Cmd+S (\e[115;9~) を転送
bind -T off User15 send-keys -H 1b 5b 31 31 35 3b 39 7e

# 設定リロード
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# =============================================================================
# prtrack session switch (Cmd+g)
# =============================================================================

set -s user-keys[14] "\e[103;9~"

# Cmd+s → サイドバーがなければ起動+表示、あればフォーカス移動
# @sidebar_focus_intended=1 をセットしてから focus-or-open を実行することで
# after-select-pane フックが「意図的なフォーカス」と判別できるようにする
set -s user-keys[15] "\e[115;9~"
bind-key -n User15 run-shell 'tmux set-option -w @sidebar_focus_intended 1 ; tmux-sidebar focus-or-open'
bind-key -n User14 run-shell "~/.local/bin/prtrack-popup"

# prtrack session で ESC → 直前の session に戻る
bind-key -n Escape if -F '#{==:#{session_name},prtrack}' 'switch-client -l' 'send-keys Escape'

# =============================================================================
# コピーモード（vim風）
# =============================================================================

# vi モード
setw -g mode-keys vi

# コピーモードでの選択
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/osc52-copy"
bind -T copy-mode-vi Y send -X select-line \; send -X copy-pipe-and-cancel "~/.local/bin/osc52-copy"

# コピーモードに入る（prefix + i）
bind i copy-mode

# =============================================================================
# 外観（Dracula テーマ）
# =============================================================================

# ステータスバー
set -g status-style bg=#282a36,fg=#f8f8f2
set -g status on
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g status-interval 1
set -g status-left-length 50
set -g status-left "#{?SSH_CONNECTION,#[fg=#282a36#,bg=#ff5555#,bold] #H #[fg=#ff5555#,bg=#282a36]#[default] ,}#[fg=#50fa7b,bold] #S #[default]│ "
set -g status-right ""

# アクティブペインの境界線
set -g pane-active-border-style fg=#bd93f9
set -g pane-border-style fg=#44475a

# ペインの境界線を太線に
set -g pane-border-lines heavy

# ペイン上部にアクティブ状態を色で表示
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#bd93f9],#[bg=default]}"

# 非アクティブペインをディム表示（bg=default で ghostty の透過を維持）
set -g window-style 'fg=#6272a4,bg=default'
set -g window-active-style 'fg=#f8f8f2,bg=default'

# ウィンドウリスト
setw -g window-status-current-style fg=#282a36,bg=#bd93f9,bold

# =============================================================================
# tmux-sidebar
# =============================================================================

# 新しいウィンドウを作るたびにサイドバーを自動生成（-d でフォーカスを移さない）
# -t "#{window_id}" を明示することで、外部セッションから new-window された場合でも
# フック発火元ウィンドウに正しく split-window が適用される（アクティブクライアント誤爆を防ぐ）
# ペイン数が 1 の場合のみ起動（二重作成を防ぐ）
set-hook -g after-new-window \
  'run-shell "[ $(tmux list-panes -t \"#{window_id}\" | wc -l) -eq 1 ] && { p=$(tmux split-window -hfb -d -l 40 -P -F \"##{pane_id}\" -t \"#{window_id}\" tmux-sidebar); tmux set-option -p -t \"$p\" @pane_role sidebar; } || true"'

# new-session の initial ウィンドウにもサイドバーを自動生成
# after-new-window は new-session の initial ウィンドウには発火しないため別途必要
set-hook -g after-new-session \
  'run-shell "[ $(tmux list-panes -t \"#{window_id}\" | wc -l) -eq 1 ] && { p=$(tmux split-window -hfb -d -l 40 -P -F \"##{pane_id}\" -t \"#{window_id}\" tmux-sidebar); tmux set-option -p -t \"$p\" @pane_role sidebar; } || true"'

# sidebar 以外のペインが全て消えた場合にウィンドウを削除する
# pane-exited: シェルが自然終了したとき / after-kill-pane: kill-pane コマンドで削除したとき
set-hook -g pane-exited 'run-shell "tmux-sidebar cleanup-if-only-sidebar"'
set-hook -g after-kill-pane 'run-shell "tmux-sidebar cleanup-if-only-sidebar"'

# ウィンドウ切替後、アクティブペインが sidebar なら隣の非 sidebar ペインへ移動する
# run-shell 引数内では #{@pane_role} が正しく展開されるため run-shell を使う
# (if -F はウィンドウコンテキストになり @pane_role が評価されない)
set-hook -g after-select-window 'run-shell "[ \"#{@pane_role}\" = sidebar ] && tmux select-pane -t \"#{pane_id}\" -R || true"'

# セッション切替後、アクティブペインが sidebar なら隣の非 sidebar ペインへ移動する
# after-select-window はセッション切替時には発火しないため client-session-changed で別途対応
set-hook -g client-session-changed 'run-shell "[ \"#{@pane_role}\" = sidebar ] && tmux select-pane -t \"#{pane_id}\" -R || true"'

# sidebar にフォーカスが当たったとき:
#   - @sidebar_focus_intended=1 なら意図的（Cmd+s）→ フラグをクリアしてキープ
#   - それ以外（ウィンドウ切替等）→ select-pane -l で直前のペインへ戻す
# after-select-pane はペインコンテキストなので #{@pane_role} が正しく評価される
set-hook -g after-select-pane \
  'if -F "#{==:#{@pane_role},sidebar}" \
    "if -F \"#{@sidebar_focus_intended}\" \
      \"set-option -wu @sidebar_focus_intended\" \
      \"select-pane -l\"" \
    ""'


# prefix+e でサイドバーを表示・非表示切り替え
bind-key e run-shell 'tmux-sidebar toggle'

# prefix+f でサイドバーにフォーカス
bind-key f run-shell 'tmux-sidebar focus-sidebar'

# =============================================================================
# プラグイン（TPM）
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'

# prefix + u で画面上の URL を fzf 一覧表示して開く
set -g @plugin 'wfxr/tmux-fzf-url'
# #NNN パターンから GitHub PR URL を生成するカスタムフィルター
set -g @fzf-url-extra-filter '~/.local/bin/tmux-fzf-url-pr-filter'
# fzf-tmux は aqua 版 fzf に含まれないため、カスタムオプション未設定で
# fzf ネイティブの --tmux フラグを使用（fzf >= 0.53.0）

# ローカル設定（オプション、git管理外）
source-file -q ~/.tmux.local.conf

# run-shell 内のサブプロセスに Homebrew・aqua の PATH を渡す（TPM等のプラグインが tmux コマンドを見つけられるようにする）
set-environment -g PATH "$HOME/.local/bin:$HOME/.local/share/aquaproj-aqua/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

run '~/.tmux/plugins/tpm/tpm'
