# =============================================================================
# 基本設定
# =============================================================================

# 256色サポート
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# マウスサポート
set -g mouse on

# ハイパーリンク（OSC 8）サポート
set -as terminal-features ",xterm-ghostty:hyperlinks"
set -ag terminal-overrides ",xterm-ghostty:Hls"
set -g allow-passthrough on

# セッション破棄時に他のセッションへ自動切替（Ghosttyの終了を防止）
set -g detach-on-destroy off

# ウィンドウ/ペイン番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ番号の自動振り直し
set -g renumber-windows on

# ヒストリサイズ
set -g history-limit 50000

# エスケープキーの遅延を無くす（vim用）
set -sg escape-time 0

# CSI u 形式の拡張キーを有効化（Ctrl+Tab等のモディファイア付きキーを認識させる）
set -s extended-keys on


# フォーカスイベント（vim用）
set -g focus-events on

# =============================================================================
# キーバインド
# =============================================================================

# prefixキーを Ctrl+Space に変更
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ペイン移動（vim風: h=左, j=下, k=上, l=右）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ペインリサイズを vim 風に
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペイン分割（現在のディレクトリで開く）
bind % split-window -h -c "#{pane_current_path}"
bind n split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# ペイン削除
bind x kill-pane

# 新しいウィンドウは現在のディレクトリで開く
bind c new-window -c "#{pane_current_path}"

# ウィンドウ一覧を現在のセッションに限定（他セッションのウィンドウは非表示）
bind w choose-tree -wf '#{session_attached}'

# fzf でセッション切り替え + 削除（既存sessionのみ表示、enter=switch, X=delete）
bind s display-popup -E "fish -c 'tm --sessions-only'"

# fzf でworktree選択 → 新規session作成（session済みworktree除外）
# -e で環境変数を設定（-E のコマンド文字列内では #{} が展開されないため -e を使う）
bind S display-popup -e "TMUX_PARENT_CLIENT=#{client_name}" -E "fish -c tmw_pick"

# 直前のセッションに戻る
bind m switch-client -l

# Ctrl+Tab → next-window（extended-keys で直接バインド）
bind-key -n C-Tab next-window
bind-key -n C-BTab previous-window

# Cmd+Up/Down でペインスクロール（Ghostty経由のユーザー定義キー）
set -s user-keys[0] "\e[1;9A"
set -s user-keys[1] "\e[1;9B"
bind-key -n User0 copy-mode -e \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User0 send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User1 send-keys -X -N 3 scroll-down

# Cmd+J/K でペインスクロール（Ghostty経由のユーザー定義キー）
set -s user-keys[2] "\e[107;9~"
set -s user-keys[3] "\e[106;9~"
bind-key -n User2 copy-mode -e \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User2 send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi User3 send-keys -X -N 3 scroll-down

# Cmd+1~9 でウィンドウ切替（Ghostty user-keys経由）
set -s user-keys[4] "\e[49;9~"
set -s user-keys[5] "\e[50;9~"
set -s user-keys[6] "\e[51;9~"
set -s user-keys[7] "\e[52;9~"
set -s user-keys[8] "\e[53;9~"
set -s user-keys[9] "\e[54;9~"
set -s user-keys[10] "\e[55;9~"
set -s user-keys[11] "\e[56;9~"
set -s user-keys[12] "\e[57;9~"
bind-key -n User4 select-window -t :1
bind-key -n User5 select-window -t :2
bind-key -n User6 select-window -t :3
bind-key -n User7 select-window -t :4
bind-key -n User8 select-window -t :5
bind-key -n User9 select-window -t :6
bind-key -n User10 select-window -t :7
bind-key -n User11 select-window -t :8
bind-key -n User12 select-window -t :9

# Cmd+G で prtrack ポップアップ表示（Ghostty user-keys経由）
set -s user-keys[13] "\e[103;9~"
bind-key -n User13 display-popup -w 90% -h 85% -E "~/.local/bin/prtrack-popup"

# ESC で prtrack ポップアップを閉じる（detach でポップアップのみ閉じ、prtrack は継続）
bind-key -n Escape if -F '#{==:#{session_name},prtrack}' 'detach-client' 'send-keys Escape'

# 設定リロード
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# =============================================================================
# コピーモード（vim風）
# =============================================================================

# vi モード
setw -g mode-keys vi

# コピーモードでの選択
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send -X select-line \; send -X copy-pipe-and-cancel "pbcopy"

# コピーモードに入る（prefix + i）
bind i copy-mode

# =============================================================================
# 外観（Dracula テーマ）
# =============================================================================

# ステータスバー
set -g status-style bg=#282a36,fg=#f8f8f2
set -g status 2
set -g 'status-format[0]' '#[fill=#21222c]'
set -g 'status-format[1]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g status-left-length 50
set -g status-left "#[fg=#50fa7b,bold] #S #[default]│ "
set -g status-right-length 80
set -g status-right "#[fg=#6272a4]#(cd #{pane_current_path}; git branch --show-current 2>/dev/null) #[fg=#bd93f9]%Y-%m-%d %H:%M "

# アクティブペインの境界線
set -g pane-active-border-style fg=#bd93f9
set -g pane-border-style fg=#44475a

# ペインの境界線を太線に
set -g pane-border-lines heavy

# 非アクティブペインをディム表示（bg=default で ghostty の透過を維持）
set -g window-style 'fg=#6272a4,bg=default'
set -g window-active-style 'fg=#f8f8f2,bg=default'

# ウィンドウリスト
setw -g window-status-current-style fg=#282a36,bg=#bd93f9,bold

# =============================================================================
# プラグイン（TPM）
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'

# prefix + u で画面上の URL を fzf 一覧表示して開く
set -g @plugin 'wfxr/tmux-fzf-url'
# #NNN パターンから GitHub PR URL を生成するカスタムフィルター
set -g @fzf-url-extra-filter '~/.local/bin/tmux-fzf-url-pr-filter'
set -g @fzf-url-fzf-options '--ansi --tmux center,100%,50% --multi --exit-0 --no-preview'

# ローカル設定（オプション、git管理外）
source-file -q ~/.tmux.local.conf

# run-shell 内のサブプロセスに Homebrew の PATH を渡す（TPM等のプラグインが tmux コマンドを見つけられるようにする）
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"

run '~/.tmux/plugins/tpm/tpm'
