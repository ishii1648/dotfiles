onboarding = false
# herdr configuration — dotfiles 管理（ADR-076）
# 実体: configs/herdr/config.toml → ~/.config/herdr/config.toml（symlink）
# 既定値の全一覧は `herdr --default-config`、検証は `herdr config check`
# （`config check` は未知のアクション名を "unknown config key" として報告するので、
#   キー名の実在確認に使える）。
# Docs: https://herdr.dev/docs/config-reference/
#
# キーバインドは現行 tmux.conf の体系に合わせてある。各行のコメントが tmux 側の対応。

[theme]
name = "dracula"

[terminal]
# 新規ペインは呼び出し元の cwd を継承（tmux の split-window -c "#{pane_current_path}" 相当）
new_cwd = "follow"

[keys]
# tmux と同じ prefix。tmux の内側で起動すると ctrl+space を tmux に横取りされるため、
# Phase 1（並走運用）では fish 関数 `hd` で tmux を経由しない ghostty ウィンドウを開く。
prefix = "ctrl+space"

# --- ペイン（tmux の pane） ---
focus_pane_left = "prefix+h"            # tmux: bind h select-pane -L
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"       # tmux: prefix+{ / } に相当（herdr は方向指定）
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
last_pane = "prefix+semicolon"          # tmux 既定の prefix+; と同じ
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
# NOTE: herdr の vertical/horizontal は vim（:vsplit = 左右）系の命名と推測している。
#       実機で逆だった場合はこの 2 行を入れ替える。
split_vertical = "prefix+n"             # tmux: bind n split-window -h（左右に並ぶ）
split_horizontal = "prefix+v"           # tmux: bind v split-window -v（上下に並ぶ）
close_pane = "prefix+x"                 # tmux: bind x kill-pane
zoom = "prefix+z"                       # tmux: prefix+z
copy_mode = "prefix+i"                  # tmux: bind i copy-mode
edit_scrollback = "prefix+shift+e"      # 既定の prefix+e は toggle_sidebar に譲る
# tmux の `bind -r H/J/K/L resize-pane -L/-D/-U/-R 5` に相当する個別バインドは herdr に無い。
# prefix+shift+r で resize モードに入り h/j/k/l で調整して esc で抜ける方式のみ。
# tmux 自体にも resize 用の Cmd ショートカットは無い（H/J/K/L 直押しのみ）ため、
# ここも物理キー入力のみで Cmd ショートカット経由の到達性は無くてよい。
resize_mode = "prefix+shift+r"

# --- タブ（tmux の window） ---
# 組み込みの new_tab（cwd を new_cwd = "follow" で継承する）は使わず、default worktree に
# 解決し直す [[keys.command]]（prefix+c）に譲る（ADR-087）。tmux: bind c new-window
new_tab = ""
# ghostty: super+shift+x=text:\x00w（prefix+w、リテラル小文字 w）。
# 既定の prefix+shift+x のままだと、ghostty から \x00X を送っても herdr は大文字 X を
# x として扱い close_pane（prefix+x）が発火してしまう（close_workspace の項を参照）。
# prefix+w は workspace_picker を prefix+s に移したことで空いている。
close_tab = "prefix+w"
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"              # Cmd+1~9 → ghostty が prefix+<digit> を送出（配線済み）
next_tab = "ctrl+tab"                   # tmux: bind-key -n C-Tab next-window（prefix 不要の直接バインド）
previous_tab = "ctrl+shift+tab"         # tmux: bind-key -n C-BTab previous-window
# Cmd+1~9 は元々 tmux の user-keys（User4-12 → select-window）用エスケープシーケンス
# だったが、herdr の switch_tab 用に転用済み（ユーザー選択）。tmux 側は Cmd+1~9 での
# window 切替を失う（素の prefix+1..9 は claude-session-switch に予約済みで代替手段なし）。

# --- workspace（tmux の session） ---
workspace_picker = "prefix+s"           # tmux: bind s display-popup -E "fish -c 'tm --sessions-only'"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+["         # tmux: prefix+( switch-client -p に相当
next_workspace = "prefix+]"             # tmux: prefix+) switch-client -n に相当
# Cmd+Shift+S は組み込みの new_workspace ではなく、ghq リポジトリを選ばせる
# [[keys.command]]（prefix+p）に譲った（ADR-077）。ghostty 側も super+shift+s=text:\x00p へ
# 変更済みで、「大文字 \x00S が s として解釈され workspace_picker が開く」問題も併せて解消した。
# 組み込みの new_workspace（cwd 継承でそのまま作る）も使わず、default worktree に解決し直す
# [[keys.command]]（prefix+shift+n）に譲る（ADR-087）。ghostty 経路は無く物理 prefix 押しのみ
# なので、リテラル大文字が shift 付きとして解釈されない制約（close_workspace の項）は無関係。
new_workspace = ""
rename_workspace = "prefix+shift+w"
# Cmd+D = フォーカス中の space（サイドバーで選択中の space）を閉じる。
# ghostty: super+d=text:\x00d（prefix+d、リテラル小文字 d）。
# 重要: herdr は端末から届いたリテラル大文字を shift 付きとして解釈しない。
# 一度 close_workspace = "prefix+shift+d" + ghostty \x00D で組んだところ、herdr は
# 大文字 D を d として扱い detach（当時 prefix+d）が発火してクライアントが切断された
# （herdr-server.log の "client detach requested via keybind" で確認）。そのため
# ghostty から到達させるアクションは prefix+<小文字> だけを使い、detach を prefix+q
# （herdr 既定）へ退避して prefix+d を close_workspace に空けた。
# herdr にはコンテキスト別バインド（サイドバーがアクティブなときだけ別動作、の類）が
# 無いため、サイドバーの状態に関係なく常に close_workspace になる。
# 誤爆対策は [ui] confirm_close = true（既定値だが明示）の確認プロンプト。
close_workspace = "prefix+d"
goto = "prefix+g"                       # session navigator（tmux の choose-tree に最も近い）
# goto / workspace_picker で開く一覧内のカーソル移動（既定は矢印キーのみ）。
# tmux-sidebar は j/k でも window 行を移動できる（docs/spec.md）ため揃える。
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# settings は既定 prefix+s だが workspace_picker に譲って空けておく。
# 現状 ghostty 側に settings 用の Cmd ショートカットは無い。
settings = ""
# tmux の `bind m switch-client -l`（直前のセッションへ戻る）に相当するアクションは herdr に無い
# （`last_workspace` は存在しない。previous_workspace は「並び順で前」であって直前ではない）。

# --- エージェント（ADR-058 の claude-session-switch / claude-nav カーソルモードの代替） ---
focus_agent = "prefix+alt+1..9"
# 一覧から選ぶ経路は Cmd+A の [[keys.command]]（prefix+a）が担う（ADR-079）。
# 組み込みの goto（prefix+g）は workspace とペインを 1 つのツリーで辿る作りで、
# 「エージェントだけ」に絞る設定が無いため自前 popup で補っている。
# 表示中の通知の発生元ペイン/タブへジャンプする（既定値のまま。用途が分かりにくいので明示）。
# NOTE: [ui.toast] delivery = "off" にしたため、対象になる「表示中の通知」が出ない可能性が高い
#       （未検証）。実際に飛べない場合は goto（prefix+g）かサイドバーから選ぶ。
open_notification_target = "prefix+o"

# --- worktree（fish 関数 tmw の代替） ---
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"

# --- その他 ---
toggle_sidebar = "prefix+e"             # tmux: bind e run-shell 'tmux-sidebar toggle'
# detach は tmux 既定に合わせて prefix+d にしていたが、close_workspace（Cmd+D）に
# 譲って herdr 既定の prefix+q へ移した。ghostty 側に Cmd ショートカットは無い。
detach = "prefix+q"
# ghostty: super+shift+r=text:\x00r（prefix+r、リテラル小文字 r。shift は無視され小文字が送られる）
# tmux: bind r source-file ~/.tmux.conf（reload）に対応
reload_config = "prefix+r"

# PR/URL 一覧を開く（tmux: bind u display-popup -E "$HOME/.local/bin/tmux-fzf-pr-popup" の後継）
# 旧 tmux 版は capture-pane した画面から URL を総なめして fzf で選ばせていた。herdr の
# pane read は OSC 8 ハイパーリンクの URL を復元できない（実測: アンカーテキストのみ残り
# URL は消える）が、gh はプレーンテキストで URL を出すため無関係。statusline.js が
# 書く現在の PR（/tmp/gh-pr-pane-<pane_id>）を先頭に、herdr pane read によるスクロール
# バックの URL スクレイプを続けて fzf multi-select に渡す（herdr-open-pr）。
[[keys.command]]
key = "prefix+u"
type = "popup"
command = "~/.local/bin/herdr-open-pr"
width = "80%"
height = "60%"

# Cmd+Shift+S: ghq リポジトリを選んで workspace を作る（ADR-077）
# 組み込みの new_workspace は cwd を継承するだけで repo を選べないため、tmux 時代の
# `tmux-sidebar new`（ADR-069/075）相当のピッカーを popup で復活させる。
# type = "popup" はコマンド終了まで全入力（Esc 含む）を受け取るモーダル端末なので fzf が動く。
# ghostty: super+shift+s=text:\x00p（prefix+p、リテラル小文字 p）。close_workspace / close_tab
# と同じ理由で prefix+<小文字> を使う（herdr はリテラル大文字を shift 付きとして解釈しない）。
# prefix+p は他のアクションに使われていない。
[[keys.command]]
key = "prefix+p"
type = "popup"
command = "~/.local/bin/herdr-new-workspace"
width = "80%"
height = "60%"

# Cmd+A: エージェント一覧を j/k で辿ってフォーカスする（ADR-079）
# navigate mode（goto = prefix+g）は workspace とペインを 1 つのツリーで扱い、spaces と
# agents に分ける設定が無い。spaces 側は組み込みの workspace_picker（prefix+s = Cmd+S）が
# あるため、欠けている agents 側だけを popup で補う。
# ghostty: super+a=text:\x00a（prefix+a、リテラル小文字 a）。close_workspace / close_tab と
# 同じ理由で prefix+<小文字> を使う（herdr はリテラル大文字を shift 付きとして解釈しない）。
# prefix+a は herdr 既定でも本 config でも未使用。
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "~/.local/bin/herdr-agent-picker"
width = "80%"
height = "60%"

# Cmd+T / prefix+shift+n: 新しい tab / workspace を repo の default worktree で開く（ADR-087）
# 組み込みの new_tab / new_workspace は cwd を [terminal] new_cwd = "follow" で継承するため、
# linked worktree に居ると新しい tab まで linked worktree で開いてしまう。スクリプトが
# 呼び出し元 pane の cwd から default worktree を解決し直して tab/workspace を作る。
# type = "shell" は detach 実行（TTY 無し）。UI を出さない一発コマンドなのでこれで足りる。
# custom command 文字列は /bin/sh -lc 経由で実行されるため引数を渡せる（公式ドキュメント）。
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "~/.local/bin/herdr-new-default-worktree tab"
description = "new tab at default worktree"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = "~/.local/bin/herdr-new-default-worktree workspace"
description = "new workspace at default worktree"

[ui]
sidebar_width = 26
copy_on_select = true
# close_workspace を Cmd+D（押しやすいキー）に割り当てているため、確認プロンプトは必須。
# 既定値だが、既定が変わっても誤爆しないよう明示する。
confirm_close = true
# tmux の new-window は名前を聞かず番号(base-index)を自動採番するだけ。herdr は既定で
# 確認プロンプトが出るため無効化する。ラベル未指定時は tab の連番がそのまま label に
# なることを `herdr tab list` で実機確認済み（number: 1 → label: "1"）。
prompt_new_tab_name = false
# エージェント状態をペイン境界にも表示する（tmux-sidebar の @pane_role 表示の代替）
show_agent_labels_on_pane_borders = true
# tmux-sidebar は session を見出し、window を子行にした階層表示（docs/spec.md）。
# "spaces" は workspace 単位でグルーピングする指定で最も近い（既定値だが明示する）。
agent_panel_sort = "spaces"

[ui.sidebar.agents]
# tmux-sidebar の window 行（[c]💬 のような agent タグ + 状態バッジ）に相当する表示。
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
# tmux-sidebar の session 見出しに相当（branch/git_status で pinned 相当の文脈情報を補う）
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
# herdr 自身の通知は出さない。macOS の通知バナーはクリックしても発生元タブに移動できず
# （herdr は OS 通知に action を紐付けない。`notification show` にも宛先指定が無い）、
# 「鳴っても飛べない」ため通知としての価値が薄い。
# 代わりに自前 watcher（configs/herdr/agent-notify.py、launchd 常駐。ADR-090）が
# agent_status: blocked（permission / 入力待ち）への遷移を terminal-notifier の
# クリックアクション付き通知で知らせ、クリックで `herdr agent focus` により
# 発生元ペインへジャンプする。
delivery = "off"

[ui.sound]
# 通知は [ui.toast] の macOS 通知のみで足りるため、herdr 自身の通知音は鳴らさない
enabled = false

[session]
# 公式 integration が入っていれば、サーバー再起動後にエージェントの会話セッションを復元する
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[experimental]
# --- 日本語 IME 対策（Phase 0 で実機確認済み） ---
# prefix モード中だけ入力ソースを ASCII レイアウトへ退避し、抜けたら復元する機能。
# 有効にすると「Claude Code のペインでたまに日本語入力に切り替わらない」症状を起こすため
# 既定値のまま無効にしてある。
#
# ghostty の Cmd 系バインドは全て `text:\x00X` で prefix を送る（configs/ghostty/config）
# ため、ペイン移動・タブ切替・エージェントピッカーのたびに ABC への切替と復元が走る。
# 入力ソース ID は復元されるが、Google 日本語入力は再選択されると内部モードが半角英数で
# 始まるので、日本語で打っている最中にペインを移ると英数に落ちる（実測: 往復 540ms）。
#
# そもそもこの機能が守る「CJK IME 有効時に物理 ctrl+space の prefix が届かない」ケースは
# 発生しない。ghostty が PTY へ直接書き込む prefix は IME を経由しないため必ず届く
# （docs/issues.md「Spike: IME 有効時の prefix」でも実機確認済み）。
switch_ascii_input_source_in_prefix = false
# Claude Code / Codex が自前でカーソルを描くと IME 候補窓が追従しない問題への対策
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
# サーバー再起動でスクロールバックを失わない（既定 false）
pane_history = true
