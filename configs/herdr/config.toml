onboarding = false
# herdr configuration — dotfiles 管理（ADR-076）
# 実体: configs/herdr/config.toml → ~/.config/herdr/config.toml（symlink）
# 既定値の全一覧は `herdr --default-config`、検証は `herdr config check`
# （`config check` は未知のアクション名を "unknown config key" として報告するので、
#   キー名の実在確認に使える）。
# Docs: https://herdr.dev/docs/config-reference/
#
# キーバインドは現行 tmux.conf の体系に合わせてある。各行のコメントが tmux 側の対応。

[theme]
name = "dracula"

[terminal]
# 新規ペインは呼び出し元の cwd を継承（tmux の split-window -c "#{pane_current_path}" 相当）
new_cwd = "follow"

[keys]
# tmux と同じ prefix。tmux の内側で起動すると ctrl+space を tmux に横取りされるため、
# Phase 1（並走運用）では fish 関数 `hd` で tmux を経由しない ghostty ウィンドウを開く。
prefix = "ctrl+space"

# --- ペイン（tmux の pane） ---
focus_pane_left = "prefix+h"            # tmux: bind h select-pane -L
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"       # tmux: prefix+{ / } に相当（herdr は方向指定）
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
last_pane = "prefix+semicolon"          # tmux 既定の prefix+; と同じ
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
# NOTE: herdr の vertical/horizontal は vim（:vsplit = 左右）系の命名と推測している。
#       実機で逆だった場合はこの 2 行を入れ替える。
split_vertical = "prefix+n"             # tmux: bind n split-window -h（左右に並ぶ）
split_horizontal = "prefix+v"           # tmux: bind v split-window -v（上下に並ぶ）
close_pane = "prefix+x"                 # tmux: bind x kill-pane
zoom = "prefix+z"                       # tmux: prefix+z
copy_mode = "prefix+i"                  # tmux: bind i copy-mode
edit_scrollback = "prefix+shift+e"      # 既定の prefix+e は toggle_sidebar に譲る
# tmux の `bind -r H/J/K/L resize-pane -L/-D/-U/-R 5` に相当する個別バインドは herdr に無い。
# prefix+shift+r で resize モードに入り h/j/k/l で調整して esc で抜ける方式のみ。
# tmux 自体にも resize 用の Cmd ショートカットは無い（H/J/K/L 直押しのみ）ため、
# ここも物理キー入力のみで Cmd ショートカット経由の到達性は無くてよい。
resize_mode = "prefix+shift+r"

# --- タブ（tmux の window） ---
new_tab = "prefix+c"                    # tmux: bind c new-window
close_tab = "prefix+shift+x"
rename_tab = "prefix+shift+t"
switch_tab = "prefix+1..9"              # Cmd+1~9 → ghostty が prefix+<digit> を送出（配線済み）
next_tab = "ctrl+tab"                   # tmux: bind-key -n C-Tab next-window（prefix 不要の直接バインド）
previous_tab = "ctrl+shift+tab"         # tmux: bind-key -n C-BTab previous-window
# Cmd+1~9 は元々 tmux の user-keys（User4-12 → select-window）用エスケープシーケンス
# だったが、herdr の switch_tab 用に転用済み（ユーザー選択）。tmux 側は Cmd+1~9 での
# window 切替を失う（素の prefix+1..9 は claude-session-switch に予約済みで代替手段なし）。

# --- workspace（tmux の session） ---
workspace_picker = "prefix+s"           # tmux: bind s display-popup -E "fish -c 'tm --sessions-only'"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+["         # tmux: prefix+( switch-client -p に相当
next_workspace = "prefix+]"             # tmux: prefix+) switch-client -n に相当
# ghostty: super+shift+s=text:\x00S（prefix+shift+s、リテラル大文字 S）
# tmux: bind S display-popup ... 'tmux-sidebar new'（新規セッション picker）に対応
new_workspace = "prefix+shift+s"
rename_workspace = "prefix+shift+w"
# Cmd+D = フォーカス中の space（サイドバーで選択中の space）を閉じる。
# ghostty: super+d=text:\x00D（prefix+shift+d、リテラル大文字 D）。
# prefix+d は detach が占有しているため、herdr 既定の prefix+shift+d のまま使う。
# herdr にはコンテキスト別バインド（サイドバーがアクティブなときだけ別動作、の類）が
# 無いため、サイドバーの状態に関係なく常に close_workspace になる。
# 誤爆対策は [ui] confirm_close = true（既定値だが明示）の確認プロンプト。
close_workspace = "prefix+shift+d"
goto = "prefix+g"                       # session navigator（tmux の choose-tree に最も近い）
# goto / workspace_picker で開く一覧内のカーソル移動（既定は矢印キーのみ）。
# tmux-sidebar は j/k でも window 行を移動できる（docs/spec.md）ため揃える。
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# settings は既定 prefix+s だが workspace_picker に譲り、new_workspace が
# prefix+shift+s（Cmd+Shift+S の実際の送出先）を占有するため空けておく。
# 現状 ghostty 側に settings 用の Cmd ショートカットは無い。
settings = ""
# tmux の `bind m switch-client -l`（直前のセッションへ戻る）に相当するアクションは herdr に無い
# （`last_workspace` は存在しない。previous_workspace は「並び順で前」であって直前ではない）。

# --- エージェント（ADR-058 の claude-session-switch / claude-nav カーソルモードの代替） ---
focus_agent = "prefix+alt+1..9"
# 表示中の通知の発生元ペイン/タブへジャンプする（既定値のまま。用途が分かりにくいので明示）。
# NOTE: [ui.toast] delivery = "off" にしたため、対象になる「表示中の通知」が出ない可能性が高い
#       （未検証）。実際に飛べない場合は goto（prefix+g）かサイドバーから選ぶ。
open_notification_target = "prefix+o"

# --- worktree（fish 関数 tmw の代替） ---
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"

# --- その他 ---
toggle_sidebar = "prefix+e"             # tmux: bind e run-shell 'tmux-sidebar toggle'
detach = "prefix+d"                     # tmux 既定の detach と同じキーに合わせる
# ghostty: super+shift+r=text:\x00r（prefix+r、リテラル小文字 r。shift は無視され小文字が送られる）
# tmux: bind r source-file ~/.tmux.conf（reload）に対応
reload_config = "prefix+r"

# PR を開く（tmux: bind u display-popup -E "$HOME/.local/bin/tmux-fzf-pr-popup" の後継）
# 旧 tmux 版は capture-pane した画面から URL を総なめして fzf で選ばせていたが、
# herdr の pane read は OSC 8 ハイパーリンクの URL を復元できない（実測: アンカー
# テキストのみ残り URL は消える。CSI/SGR は保持される）。
# statusline.js が表示中の PR を /tmp/gh-pr-<md5(cwd)> に書き出しているので、
# 「statusline に出ている PR へ飛ぶ」用途は画面スクレイプ不要でそちらが一次情報。
# fzf の選択 UI が要らなくなったので type = "popup" ではなく "shell"（背景実行）。
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "~/.local/bin/herdr-open-pr"

[ui]
sidebar_width = 26
copy_on_select = true
# close_workspace を Cmd+D（押しやすいキー）に割り当てているため、確認プロンプトは必須。
# 既定値だが、既定が変わっても誤爆しないよう明示する。
confirm_close = true
# tmux の new-window は名前を聞かず番号(base-index)を自動採番するだけ。herdr は既定で
# 確認プロンプトが出るため無効化する。ラベル未指定時は tab の連番がそのまま label に
# なることを `herdr tab list` で実機確認済み（number: 1 → label: "1"）。
prompt_new_tab_name = false
# エージェント状態をペイン境界にも表示する（tmux-sidebar の @pane_role 表示の代替）
show_agent_labels_on_pane_borders = true
# tmux-sidebar は session を見出し、window を子行にした階層表示（docs/spec.md）。
# "spaces" は workspace 単位でグルーピングする指定で最も近い（既定値だが明示する）。
agent_panel_sort = "spaces"

[ui.sidebar.agents]
# tmux-sidebar の window 行（[c]💬 のような agent タグ + 状態バッジ）に相当する表示。
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
# tmux-sidebar の session 見出しに相当（branch/git_status で pinned 相当の文脈情報を補う）
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
# 通知は出さない。macOS の通知バナーはクリックしても発生元タブに移動できず
# （herdr は OS 通知に action を紐付けない。`notification show` にも宛先指定が無い）、
# 「鳴っても飛べない」ため通知としての価値が薄い。状態把握はサイドバーの
# state_icon（および pane 境界の agent ラベル）で足りる。
# クリックでタブ遷移させたい場合は $HERDR_PANE_ID + `herdr agent focus` を使う
# 自前実装か、第三者プラグイン（yankewei/herdr-focus-notify）が必要になる。
delivery = "off"

[ui.sound]
# 通知は [ui.toast] の macOS 通知のみで足りるため、herdr 自身の通知音は鳴らさない
enabled = false

[session]
# 公式 integration が入っていれば、サーバー再起動後にエージェントの会話セッションを復元する
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[experimental]
# --- 日本語 IME 対策（Phase 0 で実機確認済み） ---
# CJK IME 有効時に prefix が届かない問題への対策（macOS のみ、best-effort）
switch_ascii_input_source_in_prefix = true
# Claude Code / Codex が自前でカーソルを描くと IME 候補窓が追従しない問題への対策
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
# サーバー再起動でスクロールバックを失わない（既定 false）
pane_history = true
