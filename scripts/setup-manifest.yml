# scripts/setup-manifest.yml
# dotfiles の理想状態を宣言的に定義する
# scripts/setup.sh がこのファイルを読んで検証・適用する

# profiles 間の共通コンポーネントを YAML アンカーで common 化することを検討したが断念。
# 理由: yaml.safe_load はアンカーを解決してから JSON 変換するため remote/linux への *common
# 適用は可能だが、full のように共通リストに ghostty を追加する場合は
# "- *common" がネストリストになり jq でのパースが壊れる。
# _anchors トップキー案も検討したが full の差分が解消されず可読性向上が限定的なため見送り。
profiles:
  full:
    - fish
    - nvim
    - ghostty
    - tmux
    - claude
    - codex
    - hitl-metrics
    - tmux-sidebar
    - aqua
    - git
    - vim
  remote:
    - fish
    - nvim
    - tmux
    - claude
    - hitl-metrics
    - tmux-sidebar
    - aqua
    - git
    - vim
  linux:
    - fish
    - nvim
    - tmux
    - claude
    - hitl-metrics
    - tmux-sidebar
    - aqua
    - git
    - vim

components:
  fish:
    setup: configs/fish/setup.sh

  nvim:
    symlinks:
      - link: ~/.config/nvim
        target: configs/nvim

  ghostty:
    symlinks:
      - link: ~/.config/ghostty/config
        target: configs/ghostty/config
      - link: ~/.local/bin/ghostty-tmux-init
        target: configs/ghostty/ghostty-tmux-init.sh

  tmux:
    setup: configs/tmux/setup.sh
    symlinks:
      - link: ~/.tmux.conf
        target: configs/tmux/tmux.conf
      - link: ~/.local/bin/tmux-fzf-url-pr-filter
        target: configs/tmux/tmux-fzf-url-pr-filter
      - link: ~/.local/bin/tmux-fzf-pr-popup
        target: configs/tmux/fzf-pr-popup.sh
    copies:
      - src: configs/tmux/tmux.remote.conf.example
        dest: ~/.tmux.local.conf
        profile: remote
        if_missing: true
      - src: configs/tmux-sidebar/hidden_sessions.example
        dest: ~/.config/tmux-sidebar/hidden_sessions
        if_missing: true

  claude:
    setup: configs/claude/setup.sh
    symlinks:
      - link: ~/.claude/CLAUDE.md
        target: configs/claude/CLAUDE.md
      - link: ~/.claude/scripts
        target: configs/claude/scripts
      - link: ~/.claude/statusline.js
        target: configs/claude/statusline.js
      - link: ~/.claude/skills/codex-sync
        target: configs/claude/skills/codex-sync
    copies:
      - src: configs/claude/settings.json
        dest: ~/.claude/settings.json
        if_missing: true
    validate:
      - type: json
        src: configs/claude/settings.json
        dest: ~/.claude/settings.json

  codex:
    setup: configs/codex/setup.sh
    symlinks:
      - link: ~/.codex/skills/dispatch
        target: configs/claude/skills/dispatch
      - link: ~/.codex/skills/orchestrate
        target: configs/claude/skills/orchestrate
      - link: ~/.codex/skills/session-log
        target: configs/claude/skills/session-log

  hitl-metrics:
    setup: configs/hitl-metrics/setup.sh

  tmux-sidebar:
    setup: configs/tmux-sidebar/setup.sh

  aqua:
    setup: configs/aqua/setup.sh
    symlinks:
      - link: ~/.config/aquaproj-aqua/aqua.yaml
        target: aqua.yaml

  vim:
    symlinks:
      - link: ~/.vimrc
        target: configs/vim/vimrc

  git:
    setup: configs/git/setup-github-ssh.sh
    copies:
      - src: configs/git/gitconfig
        dest: ~/.gitconfig
        if_missing: true
        profile: linux
      - src: configs/git/gitconfig.macos
        dest: ~/.gitconfig
        if_missing: true
        profile: full
      - src: configs/git/gitconfig.macos
        dest: ~/.gitconfig
        if_missing: true
        profile: remote
    validate:
      - type: gitconfig
        src: configs/git/gitconfig
        dest: ~/.gitconfig
