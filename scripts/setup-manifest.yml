# scripts/setup-manifest.yml
# dotfiles の理想状態を宣言的に定義する
# scripts/setup.sh がこのファイルを読んで検証・適用する

profiles:
  full:
    - fish
    - nvim
    - ghostty
    - tmux
    - claude
    - aqua
    - git
  remote:
    - fish
    - nvim
    - tmux
    - claude
    - aqua
    - git
  linux:
    - fish
    - nvim
    - tmux
    - claude
    - aqua
    - git

components:
  fish:
    setup: configs/fish/setup.sh

  nvim:
    symlinks:
      - link: ~/.config/nvim
        target: configs/nvim

  ghostty:
    symlinks:
      - link: ~/.config/ghostty/config
        target: configs/ghostty/config
      - link: ~/.local/bin/ghostty-tmux-init
        target: configs/ghostty/ghostty-tmux-init.sh

  tmux:
    symlinks:
      - link: ~/.tmux.conf
        target: configs/tmux/tmux.conf
      - link: ~/.local/bin/tmux-fzf-url-pr-filter
        target: configs/tmux/tmux-fzf-url-pr-filter
    copies:
      - src: configs/tmux/tmux.remote.conf.example
        dest: ~/.tmux.local.conf
        profile: remote
        if_missing: true

  claude:
    symlinks:
      - link: ~/.claude/CLAUDE.md
        target: configs/claude/CLAUDE.md
      - link: ~/.claude/scripts
        target: configs/claude/scripts
      - link: ~/.claude/statusline.js
        target: configs/claude/statusline.js
      - link: ~/.claude/skills/textlint
        target: configs/claude/skills/textlint
      - link: ~/.local/bin/claude-stats
        target: configs/claude/scripts/claude-stats
    copies:
      - src: configs/claude/settings.json
        dest: ~/.claude/settings.json
        if_missing: true
    validate:
      - type: json
        src: configs/claude/settings.json
        dest: ~/.claude/settings.json

  aqua:
    setup: configs/aqua/setup.sh
    symlinks:
      - link: ~/.config/aquaproj-aqua/aqua.yaml
        target: aqua.yaml

  git:
    setup: configs/git/setup-github-ssh.sh
    copies:
      - src: configs/git/gitconfig
        dest: ~/.gitconfig
        if_missing: true
        profile: linux
      - src: configs/git/gitconfig.macos
        dest: ~/.gitconfig
        if_missing: true
        profile: full
      - src: configs/git/gitconfig.macos
        dest: ~/.gitconfig
        if_missing: true
        profile: remote
    validate:
      - type: gitconfig
        src: configs/git/gitconfig
        dest: ~/.gitconfig
