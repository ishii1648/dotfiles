# scripts/setup-manifest.yml
# dotfiles の理想状態を宣言的に定義する
# scripts/setup.sh がこのファイルを読んで検証・適用する

# profiles 間の共通コンポーネントを YAML アンカーで common 化することを検討したが断念。
# 理由: yaml.safe_load はアンカーを解決してから JSON 変換するため remote/linux への *common
# 適用は可能だが、full のように共通リストに ghostty を追加する場合は
# "- *common" がネストリストになり jq でのパースが壊れる。
# _anchors トップキー案も検討したが full の差分が解消されず可読性向上が限定的なため見送り。
profiles:
  full:
    - fish
    - nvim
    - ghostty
    - claude
    - codex
    # herdr integration は ~/.claude/settings.json と ~/.codex/hooks.json（dotfiles への
    # symlink）を書き換えるため、claude / codex の配置が終わった後に実行する（ADR-076）
    - herdr
    - aqua
    - git
    - vim
  remote:
    - fish
    - nvim
    - claude
    - herdr
    - aqua
    - git
    - vim
  linux:
    - fish
    - nvim
    - claude
    - herdr
    - aqua
    - git
    - vim

components:
  fish:
    setup: configs/fish/setup.sh
    symlinks:
      # launchd agent（com.user.worktree-auto-cleanup）から呼ばれる（ADR-083）。
      # plist に dotfiles clone の絶対パスを直書きすると端末ごとに壊れるため、
      # herdr の *.sh 群（ADR-077/079）と同じく ~/.local/bin 経由の間接参照にする
      - link: ~/.local/bin/worktree-auto-cleanup
        target: configs/fish/scripts/worktree-auto-cleanup.sh
        nix_managed: true

  nvim:
    symlinks:
      - link: ~/.config/nvim
        target: configs/nvim
        nix_managed: true

  ghostty:
    symlinks:
      - link: ~/.config/ghostty/config
        target: configs/ghostty/config
        nix_managed: true

  # ADR-076: tmux / tmux-sidebar を撤去し herdr に一本化した（Phase 3/4 完了）
  herdr:
    setup: configs/herdr/setup.sh
    symlinks:
      - link: ~/.config/herdr/config.toml
        target: configs/herdr/config.toml
        nix_managed: true
      # config.toml の [[keys.command]] key = "prefix+u" から呼ばれる
      - link: ~/.local/bin/herdr-open-pr
        target: configs/herdr/open-pr.sh
        nix_managed: true
      # config.toml の [[keys.command]] key = "prefix+shift+s" から呼ばれる（ADR-077）
      - link: ~/.local/bin/herdr-new-workspace
        target: configs/herdr/new-workspace.sh
        nix_managed: true
      # config.toml の [[keys.command]] key = "prefix+a" から呼ばれる（ADR-079）
      - link: ~/.local/bin/herdr-agent-picker
        target: configs/herdr/agent-picker.sh
        nix_managed: true
      # config.toml の [[keys.command]] key = "prefix+c" / "prefix+shift+n" から呼ばれる（ADR-087）
      - link: ~/.local/bin/herdr-new-default-worktree
        target: configs/herdr/new-default-worktree.sh
        nix_managed: true
      # new-workspace.sh / new-default-worktree.sh からバックグラウンドで呼ばれる（ADR-088）
      - link: ~/.local/bin/herdr-pull-default-branch
        target: configs/herdr/pull-default-branch.sh
        nix_managed: true

  claude:
    setup: configs/claude/setup.sh
    symlinks:
      - link: ~/.claude/CLAUDE.md
        target: configs/claude/CLAUDE.md
        nix_managed: true
      - link: ~/.claude/scripts
        target: configs/claude/scripts
        nix_managed: true
      - link: ~/.claude/statusline.js
        target: configs/claude/statusline.js
        nix_managed: true
      - link: ~/.claude/skills/codex-sync
        target: configs/claude/skills/codex-sync
        nix_managed: true
    copies:
      - src: configs/claude/settings.json
        dest: ~/.claude/settings.json
        if_missing: true
    validate:
      - type: json
        src: configs/claude/settings.json
        dest: ~/.claude/settings.json

  codex:
    setup: configs/codex/setup.sh

  aqua:
    setup: configs/aqua/setup.sh
    symlinks:
      - link: ~/.config/aquaproj-aqua/aqua.yaml
        target: aqua.yaml
        nix_managed: true

  vim:
    symlinks:
      - link: ~/.vimrc
        target: configs/vim/vimrc
        nix_managed: true

  git:
    setup: configs/git/setup-github-ssh.sh
    copies:
      - src: configs/git/gitconfig
        dest: ~/.gitconfig
        if_missing: true
        profile: linux
      - src: configs/git/gitconfig.macos
        dest: ~/.gitconfig
        if_missing: true
        profile: full
      - src: configs/git/gitconfig.macos
        dest: ~/.gitconfig
        if_missing: true
        profile: remote
    validate:
      - type: gitconfig
        src: configs/git/gitconfig
        dest: ~/.gitconfig
